<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pieces of Pinewick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one centered pixel-scaled game screen, touch pad below on phones/tablets. Single dark arcade look. */
:root{
  --bg:#14111f; --frame:#3a3058; --ink:#f3e9c6; --gold:#f2b630; --muted:#9a92b8; --btn:#2a2340; --btn-hi:#4a3e70;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pixel);margin:0;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  -webkit-user-select:none;user-select:none}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid var(--frame);
  box-shadow:0 0 0 2px #000,0 10px 40px rgba(0,0,0,.55);touch-action:none;outline:none}
#game:focus-visible{border-color:var(--gold)}
.help{font-size:9px;line-height:2;color:var(--muted);text-align:center;margin-top:8px}
.help b{color:var(--ink);font-weight:normal}
#touch{display:none;width:100%;max-width:720px;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;touch-action:none}
#touch .grp{display:flex;gap:10px}
#touch button{font-family:var(--pixel);font-size:14px;color:var(--ink);background:var(--btn);border:3px solid var(--frame);
  border-radius:10px;width:64px;height:64px;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button.on{background:var(--btn-hi);border-color:var(--gold)}
#touch button.big{width:96px;font-size:11px}
#touch button.mid{font-size:10px}
#touch button.sm{width:48px;height:48px;font-size:10px;align-self:center}
@media (pointer:coarse){#touch{display:flex}.help{display:none}}
</style>

<div id="wrap"><canvas id="game" width="320" height="192" tabindex="0" aria-label="Pieces of Pinewick game screen"></canvas></div>
<div id="touch" aria-hidden="true">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="down">&#9660;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="mute" class="sm">&#9835;</button><button data-k="pause" class="sm">II</button><button data-k="throw" class="mid">ROCK</button><button data-k="jump" class="big">JUMP</button></div>
</div>
<div class="help"><b>Arrows/WASD</b> move &nbsp; <b>Space/Z/Up</b> jump &nbsp; <b>X/J</b> throw rock &nbsp; <b>Down</b> open door &nbsp; <b>Enter</b> select &nbsp; <b>P/Esc</b> pause &nbsp; <b>M</b> sound</div>

<script>
(()=>{
'use strict';
const W=320,H=192,TS=16,ROWS=12;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const FONT='"Press Start 2P", monospace';

/* ================= utilities ================= */
function rng(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hex(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function circ(g,cx,cy,r,col){g.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));g.fillRect(cx-w,cy+y,w*2+1,1);}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function makeSprite(w,h,fn,ol){
  ol=ol||'#1a1020';
  const c=cnv(w+2,h+2),g=c.getContext('2d');
  fn((x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x+1,y+1,ww,hh);});
  const W2=w+2,H2=h+2,im=g.getImageData(0,0,W2,H2),d=im.data,src=new Uint8ClampedArray(d),[r,gg,b]=hex(ol);
  const n=(x,y)=>x>=0&&y>=0&&x<W2&&y<H2&&src[(y*W2+x)*4+3]>0;
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){const i=(y*W2+x)*4;if(src[i+3])continue;
    if(n(x-1,y)||n(x+1,y)||n(x,y-1)||n(x,y+1)){d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255;}}
  g.putImageData(im,0,0);return c;
}
function spr(img,x,y,flip){x=Math.round(x);y=Math.round(y);
  if(flip){ctx.save();ctx.translate(x+img.width,y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}
  else ctx.drawImage(img,x,y);}

/* ================= text & UI ================= */
function txt(s,x,y,col,align,size,shadow){
  size=size||8;ctx.font=size+'px '+FONT;ctx.textBaseline='top';ctx.textAlign=align||'left';
  if(shadow!==false){ctx.fillStyle='#120c1c';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);}
  ctx.fillStyle=col||'#f3e9c6';ctx.fillText(s,Math.round(x),Math.round(y));
}
function panel(x,y,w,h,fill){
  ctx.fillStyle='#0c0814';ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle=fill||'#211a36';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#f3e9c6';ctx.fillRect(x+1,y+1,w-2,1);ctx.fillRect(x+1,y+h-2,w-2,1);ctx.fillRect(x+1,y+1,1,h-2);ctx.fillRect(x+w-2,y+1,1,h-2);
  ctx.fillStyle='#5a4f80';ctx.fillRect(x+3,y+3,w-6,1);ctx.fillRect(x+3,y+h-4,w-6,1);ctx.fillRect(x+3,y+3,1,h-6);ctx.fillRect(x+w-4,y+3,1,h-6);
}
let BTN=[];
function btn(x,y,w,h,fn){BTN.push({x,y,w,h,fn});}
function wrapText(s,maxChars){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>maxChars){out.push(line.trim());line=w;}else line+=' '+w;}if(line.trim())out.push(line.trim());return out;}

/* ================= input ================= */
const K={},P={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'jump',KeyK:'jump',Enter:'ok',NumpadEnter:'ok',Escape:'pause',KeyP:'pause',KeyM:'mute',KeyX:'throw',KeyJ:'throw',ShiftLeft:'throw',ShiftRight:'throw',Backspace:'back'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(!a)return;e.preventDefault();if(!K[a])P[a]=true;K[a]=true;unlockAudio();});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(!a)return;K[a]=false;});
addEventListener('blur',()=>{for(const k in K)K[k]=false;});
const confirmP=()=>P.ok||P.jump;
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();unlockAudio();if(!K[k])P[k]=true;K[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}}
  const off=e=>{K[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
cv.addEventListener('pointerdown',e=>{
  unlockAudio();cv.focus();
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left-cv.clientLeft)/cv.clientWidth*W, y=(e.clientY-r.top-cv.clientTop)/cv.clientHeight*H;
  for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){b.fn();return;}}
});

/* ================= audio ================= */
let AC=null,muted=false;
function unlockAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f1,f2,dur,type,vol,delay){if(muted||!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}
const arp=(fs,step,dur,v)=>fs.forEach((f,i)=>tone(f,f,dur,'square',v||0.045,i*step));
const SFX={
  jump:()=>tone(260,560,0.12,'square',0.045),dbl:()=>tone(420,900,0.13,'square',0.045),
  leaf:()=>{tone(1320,1320,0.05,'triangle',0.07);tone(1760,1760,0.09,'triangle',0.07,0.05);},
  stomp:()=>tone(320,80,0.15,'square',0.07),hurt:()=>tone(520,90,0.3,'sawtooth',0.055),spring:()=>tone(180,980,0.25,'triangle',0.09),
  buy:()=>arp([523,659,784,1047],0.07,0.1),deny:()=>tone(150,110,0.22,'square',0.06),piece:()=>arp([523,659,784,1047,784,1047,1319],0.1,0.14),
  clear:()=>arp([392,523,659,784,1047],0.09,0.15),die:()=>arp([440,330,262,196,131],0.12,0.15,0.06),select:()=>tone(720,720,0.04,'square',0.035),
  check:()=>tone(600,1300,0.25,'triangle',0.07),whistle:()=>{for(let k=0;k<5;k++)tone(2300+(k%2)*250,2300+(k%2)*250,0.05,'square',0.025,k*0.05);},oneup:()=>arp([660,880,1320,1760,1320,1760],0.07,0.12),door:()=>{tone(200,160,0.12,'square',0.05);tone(260,220,0.1,'square',0.05,0.12);},screech:()=>tone(1300,500,0.35,'sawtooth',0.035),honk:()=>{tone(330,260,0.14,'square',0.06);tone(330,260,0.14,'square',0.06,0.17);},throw:()=>tone(500,250,0.08,'square',0.04),rock:()=>{tone(300,300,0.04,'square',0.05);tone(450,450,0.06,'square',0.05,0.04);},
  thud:()=>tone(120,40,0.3,'square',0.09),bosshit:()=>{tone(220,110,0.12,'square',0.08);tone(880,440,0.12,'square',0.05,0.05);},
  steal:()=>{tone(1400,1800,0.05,'square',0.04);tone(1800,600,0.18,'square',0.045,0.06);},crumble:()=>tone(140,60,0.25,'sawtooth',0.035),shield:()=>tone(900,300,0.3,'triangle',0.07)
};
const SONGS=[
  {tempo:152,mel:[72,0,76,0,79,0,76,77,79,0,81,79,77,76,74,0,72,0,76,0,79,0,84,83,81,79,77,74,72,0,0,0],
   bass:[48,0,55,0,48,0,55,0,53,0,60,0,53,0,60,0,48,0,55,0,48,0,55,0,50,0,55,0,43,0,55,0]},
  {tempo:132,mel:[69,0,72,0,76,0,74,72,71,0,72,74,76,0,0,0,69,0,72,0,77,76,74,72,71,72,68,71,69,0,0,0],
   bass:[45,0,52,0,45,0,52,0,41,0,48,0,41,0,48,0,45,0,52,0,45,0,52,0,40,0,47,0,45,0,52,0]},
  {tempo:112,mel:[65,0,69,72,0,72,70,69,67,0,70,74,0,74,72,70,69,0,72,77,0,76,74,72,70,69,67,65,67,0,0,0],
   bass:[41,0,48,0,41,0,48,0,46,0,53,0,46,0,53,0,41,0,48,0,45,0,48,0,43,0,48,0,41,0,0,0]}
];
const mus={song:-1,step:0,nextT:0,iv:null};
function playSong(i){if(mus.song===i)return;mus.song=i;mus.step=0;mus.nextT=0;if(!mus.iv)mus.iv=setInterval(schedMusic,30);}
function note(m,dur,type,vol,t){const f=440*Math.pow(2,(m-69)/12),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+dur*0.6);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}
function schedMusic(){if(!AC||AC.state!=='running'||mus.song<0)return;const s=SONGS[mus.song],dt=60/s.tempo/2;
  if(mus.nextT<AC.currentTime)mus.nextT=AC.currentTime+0.03;
  while(mus.nextT<AC.currentTime+0.15){if(!muted){const m=s.mel[mus.step%s.mel.length],b=s.bass[mus.step%s.bass.length];
      if(m)note(m,dt*0.85,'square',0.022,mus.nextT);if(b)note(b,dt*1.6,'triangle',0.065,mus.nextT);}
    mus.nextT+=dt;mus.step++;}}

/* ================= themes ================= */
const THEMES=[
 {name:'Maple Street',style:'houses',top:'grass',sky:['#4d9be0','#c4e6f7'],far:'#8eb6d6',farW:'#e6f2fb',near:'#4f8a45',nearHi:'#6aa85a',gTop:'#6cc04a',gTop2:'#3f8f2e',gFill:'#8a5a32',gFill2:'#6a4224',brick:'#c06a40',brick2:'#7e3e22',song:0,clouds:true},
 {name:'Willow Park',style:'trees',top:'grass',sky:['#5cb0ee','#d8f2ff'],far:'#79b98a',farW:'#a5d6a8',near:'#3a7f42',nearHi:'#58a058',gTop:'#7ad04e',gTop2:'#4a9a32',gFill:'#7a5230',gFill2:'#5a3a20',brick:'#a0804c',brick2:'#6a5030',song:0,clouds:true},
 {name:'Market Square',style:'market',top:'stone',sky:['#ee9c58','#fbe4ac'],far:'#c48a6c',farW:'#ffe2a2',near:'#9a5e3e',nearHi:'#b8784e',gTop:'#cfc0a0',gTop2:'#968670',gFill:'#7a6a5a',gFill2:'#5a4c40',brick:'#c4744c',brick2:'#8a4630',song:0,clouds:true},
 {name:'Harbor Docks',style:'sea',top:'plank',sky:['#3f86d4','#acdcf2'],far:'#3a6aa8',farW:'#9cc8ee',near:'#2c5c92',nearHi:'#4a7cb0',gTop:'#b0804e',gTop2:'#7a5430',gFill:'#6a4a2c',gFill2:'#4a321e',brick:'#8e6c48',brick2:'#5a4430',song:0,clouds:true},
 {name:'Pinewick School',style:'school',top:'tile',indoor:true,sky:['#3a3644','#e6dcc4'],far:'#c08a50',farW:'#9cd0f0',near:'#3a6aa8',nearHi:'#5a8ac8',gTop:'#e2dac8',gTop2:'#4a6a9a',gFill:'#5a5662',gFill2:'#46424e',brick:'#a8604e',brick2:'#6a3430',song:0},
 {name:'Old Mill Woods',style:'mill',branches:true,top:'grass',sky:['#e4844a','#f8dc94'],far:'#b8784a',farW:'#e8b070',near:'#8a5a2a',nearHi:'#a87038',gTop:'#dca43c',gTop2:'#a8701e',gFill:'#7a4e2a',gFill2:'#5a361a',brick:'#a06e3c',brick2:'#6a4422',song:0,clouds:true},
 {name:'Clock Tower',style:'clock',top:'stone',sky:['#121636','#3c3c7c'],far:'#262a58',farW:'#ffe08a',near:'#1a1c40',nearHi:'#2c2e5c',gTop:'#7484a4',gTop2:'#4a5878',gFill:'#3a3e58',gFill2:'#2a2c40',brick:'#80709a',brick2:'#4a405a',song:1,stars:true},
 {name:'Under Tunnels',style:'cave',top:'stone',sky:['#0c0a16','#2a2238'],far:'#261d32',farW:'#5ae0c0',near:'#1c1528',nearHi:'#2e2440',gTop:'#76668a',gTop2:'#46385a',gFill:'#34283e',gFill2:'#241a2c',brick:'#5e4e70',brick2:'#3a2e48',song:1},
 {name:'Lighthouse Point',style:'light',top:'grass',sky:['#26387c','#f4946a'],far:'#3a3a6c',farW:'#ffe8a0',near:'#2a4a6a',nearHi:'#3e6488',gTop:'#8ab86a',gTop2:'#5a8a4a',gFill:'#6a6a7a',gFill2:'#4a4a5a',brick:'#ccc4b4',brick2:'#8a8274',song:1,sun:'#ffcf7a'}
];
/* tree canopy colors per level: [leaves, shade, highlight, trunk, trunkShade] (tunnels grow giant mushrooms) */
const CANOPY=[
 ['#4aa83e','#2e7a2a','#8ad86a','#6a4424','#4a2c16'],['#3e9e48','#25702e','#7cd070','#6a4424','#4a2c16'],
 ['#58a840','#357a28','#9ad870','#6e4826','#4a2c16'],['#4a9a5a','#2a6a3a','#86cc8a','#6a4424','#4a2c16'],
 ['#3a7a5a','#24503c','#6aa880','#4a3428','#2e2018'],['#e08a2a','#a85818','#f8c060','#6a4424','#4a2c16'],
 ['#2e6a5a','#1a4438','#4e9a80','#3e2e2a','#261c1a'],['#9a5ac8','#64348a','#d8b0f4','#d8cce0','#a89ab8'],
 ['#4a9a6a','#2e6a44','#86c89a','#6a4424','#4a2c16']];

/* ---------- backgrounds ---------- */
const BGC={};
function getBG(i){if(BGC[i])return BGC[i];const th=THEMES[i],r=rng(77+i*13);
  // sky with 16-bit banding + dither
  const sky=cnv(W,H),g=sky.getContext('2d');const bands=12,bh=H/bands;
  for(let b=0;b<bands;b++){g.fillStyle=mix(th.sky[0],th.sky[1],b/(bands-1));g.fillRect(0,b*bh,W,bh+1);
    if(b<bands-1){const nx=mix(th.sky[0],th.sky[1],(b+1)/(bands-1));g.fillStyle=nx;const y=Math.round((b+1)*bh);
      for(let x=0;x<W;x+=4)g.fillRect(x+((y/2|0)%2)*2,y-2,1,1);for(let x=0;x<W;x+=2)g.fillRect(x+(y%2),y-1,1,1);}}
  if(th.stars){for(let k=0;k<70;k++){g.fillStyle=r()<0.2?'#ffe9a0':'#cfd6ff';g.fillRect(r()*W|0,r()*110|0,1,1);}
    circ(g,262,30,12,'#f4ecc8');circ(g,267,26,10,mix(th.sky[0],th.sky[1],0.15));}
  if(th.sun){circ(g,250,118,22,th.sun);g.fillStyle=mix(th.sun,th.sky[1],0.5);for(let y=100;y<140;y+=4)g.fillRect(226,y,48,1);}
  // far layer
  const far=cnv(256,H),f=far.getContext('2d');
  if(th.clouds){for(let k=0;k<4;k++){const cx=20+k*64+(r()*20|0),cy=18+(r()*40|0);const cc='#ffffff';
      circ(f,cx,cy,8,cc);circ(f,cx+10,cy-4,10,cc);circ(f,cx+22,cy,8,cc);f.fillStyle=cc;f.fillRect(cx-8,cy,38,8);
      f.fillStyle='#dbe8f2';f.fillRect(cx-6,cy+7,34,2);}}
  const st=th.style;
  const house=(x,w,h,base,col,win,roofCol)=>{f.fillStyle=col;f.fillRect(x,base-h,w,h);
    const rh=Math.ceil(w/2.4);for(let k=0;k<rh;k++){f.fillStyle=roofCol;const inset=Math.floor(k*(w/2)/rh);f.fillRect(x-2+inset,base-h-k,w+4-inset*2,1);}
    if(r()<0.6){f.fillStyle=roofCol;f.fillRect(x+w-8,base-h-rh+2,4,8);}
    for(let wy=base-h+6;wy<base-8;wy+=10)for(let wx=x+4;wx<x+w-5;wx+=8){f.fillStyle=r()<0.7?win:mix(col,'#000000',0.25);f.fillRect(wx,wy,4,5);}};
  if(st==='houses'||st==='market'){let x=2;while(x<240){const w=22+(r()*18|0),h=26+(r()*34|0);house(x,w,h,168,th.far,th.farW,mix(th.far,'#000000',0.18));

function tile(tx,ty){const st=G.stage;if(ty<0||ty>=st.rows)return'.';if(tx<0||tx>=st.w)return'#';return st.tiles[ty][tx];}
const isSolid=c=>c==='#'||c==='='||c==='C';
function solidAt(tx,ty){if(tx<0||tx>=G.stage.w)return true;return isSolid(tile(tx,ty));}
function moveX(o){o.x+=o.vx;o.hitWall=false;const top=Math.floor(o.y/TS),bot=Math.floor((o.y+o.h-0.01)/TS);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-0.01)/TS);for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){o.x=tx*TS-o.w;o.vx=0;o.hitWall=true;break;}}
  else if(o.vx<0){const tx=Math.floor(o.x/TS);for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){o.x=(tx+1)*TS;o.vx=0;o.hitWall=true;break;}}}

  else if(o.vy<0){const ty=Math.floor(o.y/TS);for(let tx=l;tx<=r;tx++)if(isSolid(tile(tx,ty))&&!(o.passUp&&tile(tx,ty)==='=')){o.y=(ty+1)*TS;o.vy=0;o.bonk=true;break;}}}

function hurt(){const p=G.p;if(p.inv>0||p.dead)return;

// squirrels grab 1 leaf per hit and run off with it; with no leaves (or a shield up) it counts as a normal hit

function updPlay(){
  const st=G.stage,p=G.p;st.t++;
  if(P.pause){G.state='pause';G.sel=0;return;}
  for(const m of st.plats){const ox=m.x,oy=m.y;m.t++;
    if(m.type==='M'){const a=0.62*Math.sin(m.t*0.02+m.ph);m.x=m.bx+Math.sin(a)*80;m.y=m.by-80+Math.cos(a)*80;}else m.y=m.by-(1-Math.cos(m.t*0.025+m.ph))/2*64;m.dx=m.x-ox;m.dy=m.y-oy;}

    if(c.state===0&&c.t<=0){c.state=1;c.t=300;st.tiles[c.y][c.x]='.';SFX.crumble();for(let i=0;i<6;i++)st.parts.push({x:c.x*TS+Math.random()*16,y:c.y*TS+Math.random()*16,vx:(Math.random()-0.5),vy:Math.random()*-1,life:40,col:'#caa874',g:0.2,sz:3});}
    else if(c.state===1&&c.t<=0){const box={x:c.x*TS,y:c.y*TS,w:16,h:16};if(!overlap(p,box)){st.tiles[c.y][c.x]='C';delete st.crumbs[k];}else c.t=20;}}
  // particles
  st.parts=st.parts.filter(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=q.g||0;return--q.life>0;});
  st.floaters=st.floaters.filter(f=>{f.y-=0.5;return--f.life>0;});
  for(const s of st.springs)if(s.comp>0)s.comp--;
  updShots(st,p);if(shake>0)shake--;
  if(st.trail&&p.onGround&&!p.ride&&st.t%10===0&&tile(Math.floor((p.x+5)/TS),Math.floor((p.y+p.h+2)/TS))==='#'){st.trail.push({x:p.x,y:p.y});if(st.trail.length>30)st.trail.shift();}
  if(st.exiting){p.face=1;p.vx=1.7;p.ride=null;if(p.x+p.w<st.w*TS-2){p.vy=Math.min(6,p.vy+0.28);moveY(p,p.y+p.h);}p.x+=1.7;if(++st.exitT>260||p.x>st.cam+W+16)clearStage();return;}
  if(p.dead){p.deadT++;p.vy+=0.25;p.y+=p.vy;if(p.deadT>80)respawn();return;}
  if(p.inv>0)p.inv--;

  // horizontal input

  else if(Rh&&!Lh){p.vx+=p.onGround||p.ride?0.32:0.2;p.face=1;}
  else{p.vx*=(p.onGround||p.ride)?0.72:0.94;if(Math.abs(p.vx)<0.05)p.vx=0;}
  if(Math.abs(p.vx)>spd)p.vx=Math.sign(p.vx)*Math.max(spd,Math.abs(p.vx)*0.9);
  // jump
  const jHeld=K.jump||K.up,jPress=P.jump||P.up;const grounded=p.onGround||!!p.ride;
  if(jPress)p.buf=7;else if(p.buf>0)p.buf--;
  if(grounded){p.coyote=6;p.dbl=true;}else if(p.coyote>0)p.coyote--;
  if(p.buf>0&&p.coyote>0){p.vy=-5.6;p.coyote=0;p.buf=0;p.onGround=false;p.ride=null;SFX.jump();}
  else if(jPress&&!grounded&&p.coyote<=0&&G.enh.dbl&&p.dbl){p.vy=-5.1;p.dbl=false;p.buf=0;SFX.dbl();
    for(let i=0;i<8;i++)st.parts.push({x:p.x+5,y:p.y+p.h,vx:(Math.random()-0.5)*2,vy:Math.random()*0.8,life:18,col:'#ffffff',g:0});}
  if(!jHeld&&p.vy<-2.2&&!p.springing)p.vy=-2.2;
  p.vy+=0.28;
  p.gliding=false;if(G.enh.glide&&jHeld&&p.vy>0.9&&!grounded){p.vy=0.9;p.gliding=true;}
  if(p.vy>6)p.vy=6;if(p.vy>=0)p.springing=false;

      if(b>=m.y&&prevBottom<=prevTop+3+(prevRide===m?6:0)){p.y=m.y-p.h;p.vy=0;p.ride=m;p.onGround=true;break;}}}}

  if(p.onGround&&!p.ride){const ty=Math.floor((p.y+p.h+1)/TS);for(let tx=Math.floor(p.x/TS);tx<=Math.floor((p.x+p.w-0.01)/TS);tx++){
      if(tile(tx,ty)==='C'){const k=tx+','+ty;if(!st.crumbs[k])st.crumbs[k]={x:tx,y:ty,t:26,state:0};}}}
  // spikes
  {const l=Math.floor(p.x/TS),r=Math.floor((p.x+p.w-0.01)/TS),t=Math.floor(p.y/TS),b=Math.floor((p.y+p.h-0.01)/TS);
    for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++)if(tile(tx,ty)==='^'){if(overlap(p,{x:tx*TS+1,y:ty*TS+4,w:14,h:12})){hurt();if(!p.dead)p.vy=-4.2;}}}

  btn(0,0,W,H,()=>{if(G.t>40)gotoMap();});}

function drawWin(){drawBG(8,G.t*0.3);ctx.fillStyle='rgba(10,6,18,0.45)';ctx.fillRect(0,0,W,H);txt('PINEWICK IS WHOLE AGAIN!',160,10,'#f8c838','center');
  drawPuzzle(112,30,-1);txt(G.two?'You both found all 9 pieces.':'You found all 9 pieces.',160,140,'#f3e9c6','center');txt('Thanks for playing!',160,154,'#9af0d0','center');
  if(G.t%6===0)for(let i=0;i<3;i++)CONF.push({x:Math.random()*W,y:-4,vy:0.6+Math.random(),col:['#f8c838','#e8384a','#43a6ee','#58c058'][Math.random()*4|0]});
  CONF.forEach(c=>{c.y+=c.vy;ctx.fillStyle=c.col;ctx.fillRect(c.x|0,c.y|0,2,3);});while(CONF.length&&CONF[0].y>H)CONF.shift();
  if(G.t>60)txt('ENTER: TITLE',160,176,Math.floor(G.t/20)%2?'#f8c838':'#f3e9c6','center',5);
  btn(0,0,W,H,()=>{if(G.t>60){G.state='title';G.sel=0;playSong(2);}});}
const CONF=[];
function updWin(){if(G.t>60&&confirmP()){G.state='title';G.sel=0;playSong(2);}}

/* ================= main loop ================= */
function update(){
  if(P.mute){muted=!muted;}
  G.t++;
  switch(G.state){
    case'title':updTitle();break;case'charsel':updCharsel();break;case'map':updMap();break;case'intro':updIntro();break;
    case'play':updPlay();break;case'pause':updPause();break;case'clear':updClear();break;case'piece':updPiece();break;
    case'shop':updShop();break;case'closed':updClosed();break;case'gameover':updGameOver();break;case'win':updWin();break;}
  for(const k in P)P[k]=false;
}
function draw(){BTN=[];
  switch(G.state){
    case'boot':ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);break;
    case'title':drawTitle();break;case'charsel':drawCharsel();break;case'map':drawMap();break;case'intro':drawIntro();break;
    case'play':drawWorld();break;case'pause':drawPause();break;case'clear':drawClear();break;case'piece':drawPiece();break;
    case'shop':drawShop();break;case'closed':drawClosed();break;case'gameover':drawGameOver();break;case'win':drawWin();break;}
  if(muted&&G.state!=='play'){txt('SOUND OFF',316,184,'#6a5a80','right',5);}
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}draw();requestAnimationFrame(frame);}

function fit(){const wrap=document.getElementById('wrap');const r=wrap.getBoundingClientRect();let s=Math.min((r.width-12)/W,(r.height-12)/H);
  if(s>=3)s=Math.floor(s);else if(s>=1.5)s=Math.floor(s*2)/2;s=Math.max(0.5,s);cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';}
addEventListener('resize',fit);fit();

const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontReady.catch(()=>{}).then(()=>{G.state='title';playSong(2);cv.focus();});
requestAnimationFrame(frame);
window.__G=G;
})();
</script>
